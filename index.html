<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Ortamda Sat</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent !important;
      user-select: none !important;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes screen-shake {
      0% { transform: translate(0, 0) scale(0.92); }
      20% { transform: translate(-3px, 3px) scale(0.92); }
      40% { transform: translate(3px, -2px) scale(0.92); }
      60% { transform: translate(-2px, -1px) scale(0.92); }
      80% { transform: translate(2px, 1px) scale(0.92); }
      100% { transform: translate(0, 0) scale(1); }
    }

    .shake-active { animation: screen-shake 0.25s cubic-bezier(.36,.07,.19,.97) both; }

    @keyframes shockwave {
      0% { transform: scale(0.8); opacity: 0.9; }
      100% { transform: scale(1.7); opacity: 0; }
    }

    .shockwave-active { animation: shockwave 0.4s ease-out forwards; }

    /* Kart Dondurme Animasyonu */
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col justify-between p-4 pb-20 font-sans antialiased overflow-x-hidden">

  <!-- UST BAR -->
  <header class="w-full max-w-sm mx-auto flex items-center justify-between pt-2 mb-2">
    <div class="flex items-center gap-2">
      <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
      <span class="text-[11px] font-extrabold tracking-widest text-zinc-400 uppercase">ORTAMDA SAT</span>
    </div>
    <button id="permBtn" onclick="requestPermission()" class="text-xs bg-zinc-900 border border-zinc-800 text-zinc-300 px-3 py-1.5 rounded-full font-semibold">
      🔔 İzin Ver
    </button>
  </header>

  <!-- SAYFA 1: ANA SAYFA (HOME) -->
  <div id="page-home" class="page-content w-full max-w-sm mx-auto flex flex-col justify-between flex-1 my-auto space-y-4">
    <main class="flex flex-col items-center justify-center my-auto py-6">
      <div class="relative flex items-center justify-center">
        <div class="absolute w-64 h-64 rounded-full bg-amber-500/20 blur-2xl pointer-events-none"></div>
        <div id="shockwaveRing" class="absolute w-56 h-56 rounded-full border-2 border-amber-400 opacity-0 pointer-events-none"></div>
        
        <button 
          id="satBtn" 
          ontouchstart="handleTouchStart(event)"
          ontouchend="handleTouchEnd(event)"
          onclick="instantSat()" 
          class="relative w-56 h-56 rounded-full bg-gradient-to-b from-amber-500 via-orange-500 to-amber-600 border-4 border-amber-300/40 shadow-[0_0_50px_rgba(245,158,11,0.35)] flex flex-col items-center justify-center transition-transform duration-75 ease-out"
        >
          <span id="btnEmoji" class="text-5xl mb-1 transition-transform duration-150">🧠</span>
          <span class="text-xl font-black tracking-wider text-zinc-950 uppercase">BİLGİ SAT</span>
          <span id="selectedCatText" class="text-[10px] font-black text-amber-950 tracking-widest uppercase opacity-80 mt-0.5">HEPSİ</span>
        </button>
      </div>
    </main>

    <footer class="bg-zinc-900/90 backdrop-blur-md border border-zinc-800/80 rounded-3xl p-4 space-y-3 shadow-2xl">
      <div class="space-y-1.5">
        <span class="text-[10px] font-extrabold text-zinc-500 uppercase tracking-wider">Kategori Seç</span>
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
          <button onclick="changeCategory('hepsi')" id="cat-hepsi" class="cat-btn bg-amber-500/20 border border-amber-500/50 text-amber-400 text-xs px-3.5 py-1.5 rounded-full font-bold whitespace-nowrap transition">✨ Hepsi</button>
          <button onclick="changeCategory('oyun')" id="cat-oyun" class="cat-btn bg-zinc-800 border border-zinc-700/60 text-zinc-400 text-xs px-3.5 py-1.5 rounded-full font-bold whitespace-nowrap transition">🎮 Oyun</button>
          <button onclick="changeCategory('cografya')" id="cat-cografya" class="cat-btn bg-zinc-800 border border-zinc-700/60 text-zinc-400 text-xs px-3.5 py-1.5 rounded-full font-bold whitespace-nowrap transition">🌍 Coğrafya</button>
          <button onclick="changeCategory('kultur')" id="cat-kultur" class="cat-btn bg-zinc-800 border border-zinc-700/60 text-zinc-400 text-xs px-3.5 py-1.5 rounded-full font-bold whitespace-nowrap transition">🎬 Pop Kültür</button>
          <button onclick="changeCategory('tarih')" id="cat-tarih" class="cat-btn bg-zinc-800 border border-zinc-700/60 text-zinc-400 text-xs px-3.5 py-1.5 rounded-full font-bold whitespace-nowrap transition">📜 Tarih</button>
          <button onclick="changeCategory('bilim')" id="cat-bilim" class="cat-btn bg-zinc-800 border border-zinc-700/60 text-zinc-400 text-xs px-3.5 py-1.5 rounded-full font-bold whitespace-nowrap transition">🔬 Bilim</button>
          <button onclick="changeCategory('hayvanlar')" id="cat-hayvanlar" class="cat-btn bg-zinc-800 border border-zinc-700/60 text-zinc-400 text-xs px-3.5 py-1.5 rounded-full font-bold whitespace-nowrap transition">🦁 Canlılar</button>
        </div>
      </div>

      <div class="flex items-center justify-between pt-2 border-t border-zinc-800/60">
        <div class="grid grid-cols-3 gap-1.5 w-1/2">
          <button type="button" onclick="selectFreq(1)" id="freq-1" class="freq-btn bg-amber-500/10 border border-amber-500/40 text-amber-400 rounded-xl py-1.5 text-center text-xs font-bold">1x</button>
          <button type="button" onclick="selectFreq(2)" id="freq-2" class="freq-btn bg-zinc-800 border border-zinc-800 text-zinc-400 rounded-xl py-1.5 text-center text-xs font-bold">2x</button>
          <button type="button" onclick="selectFreq(3)" id="freq-3" class="freq-btn bg-zinc-800 border border-zinc-800 text-zinc-400 rounded-xl py-1.5 text-center text-xs font-bold">3x</button>
        </div>
        <button id="toggleAutoBtn" onclick="toggleAutoSat()" class="w-2/5 py-2.5 bg-zinc-100 hover:bg-white text-zinc-950 font-black text-xs rounded-xl transition shadow-lg">
          Otomatik Başlat
        </button>
      </div>
    </footer>
  </div>

  <!-- SAYFA 2: OYUN (DOĞRU MU YALAN MI?) -->
  <div id="page-game" class="page-content hidden w-full max-w-sm mx-auto flex-1 flex flex-col justify-between py-2">
    <div class="text-center space-y-1 mb-4">
      <h2 class="text-lg font-black text-amber-400 tracking-wide uppercase">🎲 DOĞRU MU YALAN MI?</h2>
      <p class="text-xs text-zinc-400">Masadakiler iddiaya girsin, cevabı açın!</p>
    </div>

    <!-- OYUN KARTI -->
    <div class="relative w-full h-72 perspective-1000 my-auto">
      <div id="gameCard" class="w-full h-full duration-500 transform-style-3d relative bg-zinc-900 border border-amber-500/30 rounded-3xl p-6 flex flex-col justify-between shadow-2xl">
        <!-- ÖN YÜZ -->
        <div class="backface-hidden w-full h-full flex flex-col justify-between">
          <div class="flex justify-between items-center">
            <span class="text-[10px] font-black bg-amber-500/20 text-amber-400 border border-amber-500/40 px-2.5 py-1 rounded-full uppercase">Soru</span>
            <span class="text-xs text-zinc-500 font-bold">İddia Modu</span>
          </div>
          <p id="gameQuestionText" class="text-base font-bold text-zinc-100 text-center my-auto leading-relaxed">
            Yükleniyor...
          </p>
          <div class="grid grid-cols-2 gap-3 w-full">
            <button onclick="answerGame(true)" class="py-3 bg-emerald-600/20 border border-emerald-500/50 text-emerald-400 font-black text-sm rounded-2xl hover:bg-emerald-600/30 transition">✅ DOĞRU</button>
            <button onclick="answerGame(false)" class="py-3 bg-rose-600/20 border border-rose-500/50 text-rose-400 font-black text-sm rounded-2xl hover:bg-rose-600/30 transition">❌ YALAN</button>
          </div>
        </div>
      </div>
    </div>

    <button onclick="nextGameQuestion()" class="w-full py-3 bg-zinc-800 border border-zinc-700 text-zinc-200 font-bold text-xs rounded-2xl mt-4">
      🔄 Sonraki İddia Sorusuna Geç
    </button>
  </div>

  <!-- SAYFA 3: TOPLULUK (TWITTER AKIŞI) -->
  <div id="page-feed" class="page-content hidden w-full max-w-sm mx-auto flex-1 flex flex-col space-y-3 py-2">
    <div class="flex items-center justify-between">
      <h2 class="text-base font-black text-zinc-200 tracking-wide">🔥 TOPLULUK AKIŞI</h2>
      <span class="text-[10px] bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded-full font-bold">Canlı</span>
    </div>
    <div id="feedList" class="space-y-3 overflow-y-auto max-h-[70vh] no-scrollbar pr-1">
      <!-- Dinamik Tweet Mantığı JavaScript'te dolacak -->
    </div>
  </div>

  <!-- SAYFA 4: BİLGİ EKLE -->
  <div id="page-add" class="page-content hidden w-full max-w-sm mx-auto flex-1 flex flex-col justify-center py-2 space-y-4">
    <div class="text-center space-y-1">
      <h2 class="text-lg font-black text-amber-400 tracking-wide uppercase">➕ KENDİ BİLGİNİ EKLE</h2>
      <p class="text-xs text-zinc-400">Bildiğin bomba bilgiyi yaz, toplulukta yayınlansın!</p>
    </div>

    <form onsubmit="submitCustomQuote(event)" class="bg-zinc-900 border border-zinc-800 rounded-3xl p-5 space-y-4 shadow-2xl">
      <div class="space-y-1.5">
        <label class="text-xs font-extrabold text-zinc-400 uppercase">Kategori</label>
        <select id="addCatSelect" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-xs font-bold text-zinc-200 focus:outline-none focus:border-amber-500">
          <option value="cografya">🌍 Coğrafya</option>
          <option value="oyun">🎮 Oyun</option>
          <option value="kultur">🎬 Pop Kültür</option>
          <option value="tarih">📜 Tarih</option>
          <option value="bilim">🔬 Bilim</option>
          <option value="hayvanlar">🦁 Canlılar</option>
        </select>
      </div>

      <div class="space-y-1.5">
        <label class="text-xs font-extrabold text-zinc-400 uppercase">Bilgi Metni</label>
        <textarea id="addQuoteText" rows="4" required placeholder="Ortamda satmalık kısa ve vurucu bilgiyi yaz..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-xs text-zinc-200 placeholder-zinc-600 focus:outline-none focus:border-amber-500 resize-none"></textarea>
      </div>

      <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-orange-500 text-zinc-950 font-black text-xs uppercase tracking-wider rounded-xl shadow-lg">
        Topluluğa Gönder
      </button>
    </form>
  </div>

  <!-- SAYFA 5: FAVORİLER -->
  <div id="page-favs" class="page-content hidden w-full max-w-sm mx-auto flex-1 flex flex-col space-y-3 py-2">
    <div class="flex items-center justify-between">
      <h2 class="text-base font-black text-amber-400 tracking-wide">⭐ FAVORİ KÜTÜPHANEM</h2>
      <span id="favCountBadge" class="text-[10px] bg-zinc-800 text-zinc-400 px-2 py-0.5 rounded-full font-bold">0 Bilgi</span>
    </div>
    <div id="favList" class="space-y-3 overflow-y-auto max-h-[70vh] no-scrollbar pr-1">
      <!-- Favoriler JS ile yüklenecek -->
    </div>
  </div>

  <!-- MOBIL BOTTOM TAB BAR -->
  <nav class="fixed bottom-0 left-0 right-0 bg-zinc-900/95 backdrop-blur-lg border-t border-zinc-800/80 px-4 py-2 z-50">
    <div class="max-w-sm mx-auto flex items-center justify-between">
      <button onclick="switchTab('home')" id="tab-home" class="tab-btn flex flex-col items-center gap-0.5 text-amber-500">
        <span class="text-lg">🏠</span>
        <span class="text-[9px] font-extrabold uppercase tracking-wider">Ana Sayfa</span>
      </button>
      <button onclick="switchTab('game')" id="tab-game" class="tab-btn flex flex-col items-center gap-0.5 text-zinc-500">
        <span class="text-lg">🎲</span>
        <span class="text-[9px] font-extrabold uppercase tracking-wider">Oyun</span>
      </button>
      <button onclick="switchTab('add')" id="tab-add" class="tab-btn flex flex-col items-center gap-0.5 text-zinc-500">
        <span class="text-lg">➕</span>
        <span class="text-[9px] font-extrabold uppercase tracking-wider">Ekle</span>
      </button>
      <button onclick="switchTab('feed')" id="tab-feed" class="tab-btn flex flex-col items-center gap-0.5 text-zinc-500">
        <span class="text-lg">🔥</span>
        <span class="text-[9px] font-extrabold uppercase tracking-wider">Akış</span>
      </button>
      <button onclick="switchTab('favs')" id="tab-favs" class="tab-btn flex flex-col items-center gap-0.5 text-zinc-500">
        <span class="text-lg">⭐</span>
        <span class="text-[9px] font-extrabold uppercase tracking-wider">Favoriler</span>
      </button>
    </div>
  </nav>

  <script src="quotes.js?v=5000"></script>
  <script src="app.js?v=5000"></script>
</body>
</html>
